<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #0f1220;
        color: #e8eaf2;
        padding: 24px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 18px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .stat {
        background: #1a1f33;
        border: 1px solid #2a3050;
        border-radius: 12px;
        padding: 16px;
      }
      .stat b {
        display: block;
        font-size: 22px;
        margin-bottom: 4px;
      }
      .stat span {
        font-size: 12px;
        color: #9aa1ba;
      }
      .chart {
        margin-top: 14px;
        height: 160px;
        border-radius: 12px;
        background: linear-gradient(180deg, #232a48, #161b30);
        border: 1px solid #2a3050;
      }
    </style>
  </head>
  <body>
    <h1>Fleet overview</h1>
    <div class="row">
      <div class="stat"><b>12</b><span>Active sessions</span></div>
      <div class="stat"><b>3</b><span>Waiting on you</span></div>
      <div class="stat"><b>98%</b><span>Green checks</span></div>
    </div>
    <div class="chart"></div>
  </body>
</html>
