<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #fbfbfd;
        color: #202538;
        padding: 24px 28px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 18px;
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
        border-bottom: 1px solid #e7e9f0;
        font-size: 14px;
      }
      .toggle {
        width: 38px;
        height: 22px;
        border-radius: 11px;
        background: #4f6bff;
        position: relative;
      }
      .toggle.off {
        background: #cdd1dd;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
      }
      .toggle.off::after {
        right: auto;
        left: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Notifications</h1>
    <div class="item">Attention badge <span class="toggle"></span></div>
    <div class="item">Sound on mention <span class="toggle off"></span></div>
    <div class="item">Daily digest <span class="toggle"></span></div>
  </body>
</html>
