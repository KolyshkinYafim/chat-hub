<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #f4f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .card {
        width: 280px;
        background: #fff;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(20, 30, 60, 0.12);
      }
      h1 {
        margin: 0 0 18px;
        font-size: 20px;
        color: #1c2333;
      }
      .field {
        height: 38px;
        border: 1px solid #d6d9e2;
        border-radius: 8px;
        margin-bottom: 12px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        color: #8b90a0;
        font-size: 13px;
      }
      .cta {
        height: 40px;
        border-radius: 8px;
        background: #4f6bff;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign in</h1>
      <div class="field">Email</div>
      <div class="field">Password</div>
      <div class="cta">Continue</div>
    </div>
  </body>
</html>
