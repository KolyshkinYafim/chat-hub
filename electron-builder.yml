appId: com.agentdesktop.chat-hub
productName: Chat Hub
copyright: Agent Desktop Suite

directories:
  output: release
  buildResources: build

# Main is bundled by electron-vite (externalized deps aren't imported at
# runtime), so we only ship the built output + manifest.
files:
  - out/**/*
  - package.json

asar: true

mac:
  target:
    - dir
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Local/unsigned build — set to null so packaging doesn't require a cert.
  identity: null

dmg:
  title: Chat Hub

# Windows/Linux left unconfigured — mac-first for now.
