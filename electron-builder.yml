appId: com.agentdesktop.chat-hub
productName: Chat Hub
copyright: Agent Desktop Suite

directories:
  output: release
  buildResources: build

# Main is bundled by electron-vite (externalized deps aren't imported at
# runtime), so we only ship the built output + manifest.
files:
  - out/**/*
  - package.json

asar: true

mac:
  target:
    - dir
  category: public.app-category.developer-tools
  darkModeSupport: true
  # No Developer ID here, so electron-builder must not go looking for a cert.
  # The bundle it leaves behind fails `codesign --verify`, so packaging/build-app.sh
  # re-signs it ad-hoc (`codesign --force --deep --sign -`) once the build and the
  # Info.plist stamping are done. Do not move that step earlier: signing seals the
  # bundle, and PlistBuddy writing into Info.plist afterwards would break the seal.
  identity: null

dmg:
  title: Chat Hub

# Windows/Linux left unconfigured — mac-first for now.
